<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cohasset Golf Club — Course Map Pre-Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #ede7d8;
    --paper-dark: #e2d9c4;
    --ink: #030e1e;
    --ink-soft: #5c6673;
    --pine: #08244a;
    --pine-dark: #041328;
    --rust: #b1975c;
    --line: #c8bfa6;
    --white: #fbf9f3;
    --error: #a4402a;
    --radius: 2px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--pine-dark);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    position: relative;
  }
  /* topographic watermark */
  .contours{
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .18;
  }
  .wrap{
    position: relative; z-index: 1;
    max-width: 560px; margin: 0 auto;
    padding: 32px 20px 80px;
  }
  .masthead{
    text-align: center; margin-bottom: 22px;
  }
  .masthead .logo{
    width: 110px; height: auto; margin: 0 auto 14px; display:block;
  }
  .logo-row{
    display:flex; align-items:center; justify-content:center; gap: 18px;
    margin-bottom: 14px;
  }
  .logo-row .logo{ margin: 0; }
  .logo-row .mcc-crest{ width: 72px; }
  .masthead .club{
    font-size: 12px; letter-spacing: .04em; color: var(--rust);
    font-weight: 600; margin-bottom: 6px;
  }
  .masthead h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.05;
    margin: 0 0 6px;
    color: var(--white);
  }
  .masthead p{
    color: #cdd0d4; font-size: 14.5px; line-height: 1.5; margin: 0 auto;
    max-width: 420px;
  }

  .ticket{
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 1px 0 rgba(35,48,43,.04);
    overflow: hidden;
    margin-top: 26px;
  }
  .hero{
    width: 100%; aspect-ratio: 16/10; background: var(--paper-dark);
    display:flex; align-items:center; justify-content:center;
    position: relative; overflow: hidden;
    border-bottom: 1px solid var(--line);
  }
  .hero img{ width:100%; height:100%; object-fit: cover; display:block; }
  .hero .placeholder{
    text-align:center; color: var(--ink-soft); font-size: 13px; padding: 20px;
    font-family: 'Fraunces', serif; font-style: italic;
  }
  .hero-caption{
    text-align:center; font-size: 10px; font-style: italic; color: var(--ink-soft);
    padding: 6px 24px 0; margin: 0;
  }
  .details{
    padding: 20px 24px 18px;
    border-bottom: 1px dashed var(--line);
  }
  .details h2{
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 20px; margin: 0 0 6px;
  }
  .details p{ margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.6; }
  .details p + p{ margin-top: 10px; }
  .prices{ display:flex; gap: 18px; margin-top: 12px; font-size: 13.5px; }
  .prices span b{ color: var(--ink); font-weight: 600; }
  .prices span{ color: var(--ink-soft); }

  .step{
    padding: 20px 24px;
    border-bottom: 1px dashed var(--line);
  }
  .step:last-of-type{ border-bottom: none; }
  .step-label{
    display:flex; align-items:baseline; justify-content: space-between;
    margin-bottom: 12px;
  }
  .step-label .name{ font-weight: 600; font-size: 15px; }
  .step-label .note{ font-size: 12.5px; color: var(--ink-soft); }

  input[type=text], input[type=email], input[type=tel], select{
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--white);
    color: var(--ink);
  }
  input::placeholder{ color: #a29c8a; }
  input:focus, select:focus{ outline: 2px solid var(--pine); outline-offset: 1px; }
  label.field{ display:block; margin-bottom: 12px; }
  label.field span{ display:block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 5px; }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3{ display:grid; grid-template-columns: 1.4fr .8fr 1fr; gap: 12px; }

  .pillgroup{ display:flex; gap: 10px; flex-wrap: wrap; }
  .pill{
    flex: 1; min-width: 130px;
    border: 1px solid var(--line);
    background: var(--white);
    border-radius: var(--radius);
    padding: 12px 14px;
    cursor: pointer;
    text-align: left;
    font-family: 'Inter', sans-serif;
    transition: border-color .15s ease, background .15s ease;
  }
  .pill:hover{ border-color: var(--pine); }
  .pill .t{ font-weight: 600; font-size: 14.5px; display:block; }
  .pill .p{ font-size: 12.5px; color: var(--ink-soft); display:block; margin-top: 2px; }
  .pill .frame-note{
    font-size: 10.5px; font-style: italic; color: var(--ink-soft);
    display:block; margin-top: 6px; line-height: 1.4; font-weight: 400;
  }
  .pill.selected{
    border-color: var(--pine);
    background: #e6e9ed;
  }
  .pill.selected .t{ color: var(--pine-dark); }

  .qtyrow{ display:flex; align-items:center; gap: 12px; }
  .stepper{ display:flex; align-items:center; border:1px solid var(--line); border-radius: var(--radius); overflow:hidden; }
  .stepper button{
    width: 38px; height: 40px; border: none; background: var(--paper-dark);
    font-size: 17px; cursor: pointer; color: var(--ink); line-height: 1;
  }
  .stepper button:hover{ background: var(--line); }
  .stepper input{
    width: 52px; text-align:center; border: none; border-left: 1px solid var(--line);
    border-right: 1px solid var(--line); height: 40px; font-size: 15px; padding: 0;
  }

  .hidden{ display:none !important; }
  .fadein{ animation: fadein .25s ease; }
  @keyframes fadein{ from{opacity:0; transform: translateY(-4px);} to{opacity:1; transform: translateY(0);} }

  .addr{ margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }

  .summary{
    padding: 18px 24px 6px;
  }
  .summary .line{
    display:flex; justify-content: space-between; font-size: 14px; padding: 5px 0; color: var(--ink-soft);
  }
  .summary .line.total{
    color: var(--ink); font-weight: 700; font-size: 16.5px;
    border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px;
  }

  .submitwrap{ padding: 8px 24px 24px; }
  button.submit{
    width: 100%;
    background: var(--pine);
    color: var(--white);
    border: none;
    padding: 14px 18px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15.5px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background .15s ease;
  }
  button.submit:hover{ background: var(--pine-dark); }
  button.submit:disabled{ background: #b5bdc9; cursor: not-allowed; }

  .errtext{ color: var(--error); font-size: 12.5px; margin-top: 6px; display:none; }
  .errtext.show{ display:block; }

  .confirm{
    text-align:center; padding: 60px 24px;
  }
  .confirm .mark{ font-family:'Fraunces', serif; font-size: 40px; color: var(--pine); margin-bottom: 6px; }
  .confirm h2{ font-family:'Fraunces', serif; font-size: 24px; margin: 0 0 10px; }
  .confirm p{ color: var(--ink-soft); font-size: 14.5px; line-height: 1.6; max-width: 380px; margin: 0 auto; }
  .confirm .oid{ margin-top: 18px; font-size: 12px; color: var(--ink-soft); font-family: 'Inter', monospace; }

  footer.foot{
    text-align:center; font-size: 12px; color: #a7acb4; margin-top: 24px;
  }
  footer.foot a{ color: var(--pine); }

  /* admin */
  .admin-wrap{ max-width: 920px; }
  .admin-gate{ max-width: 360px; margin: 80px auto; text-align:center; }
  .admin-gate h2{ font-family:'Fraunces', serif; margin-bottom: 14px; color: var(--white); }
  .admin-gate label.field span{ color: #cdd0d4; }
  table.orders{ width:100%; border-collapse: collapse; font-size: 13px; background: var(--white); }
  table.orders th, table.orders td{ border: 1px solid var(--line); padding: 8px 10px; text-align: left; white-space: nowrap; }
  table.orders th{ background: var(--paper-dark); font-weight: 600; }
  .admin-bar{ display:flex; justify-content: space-between; align-items:center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .admin-bar select{ width:auto; }
  .btn-secondary{
    background: var(--pine); color: var(--white); border:none; padding: 9px 16px;
    border-radius: var(--radius); cursor:pointer; font-family:'Inter',sans-serif; font-size: 13.5px; font-weight: 600;
  }
  .btn-secondary:hover{ background: var(--pine-dark); }
  .tablewrap{ overflow-x:auto; border: 1px solid var(--line); }
  .admin-empty{ color: var(--ink-soft); padding: 30px; text-align:center; }
</style>
</head>

function getClub(){
  const params = new URLSearchParams(window.location.search);
  if (params.get("club")) return params.get("club");
  return CONFIG.clubDefault;
}

/* Let a handful of fields be overridden per batch via URL params, so
   updating the hero pic / header for a new club needs zero code edits —
   just change the query string in the Shopify iframe embed.
     ?club=TrailRunnersATL
     &hero=https://cdn.shopify.com/.../map-photo.jpg
     &title=Ridgeline+Course+Map
     &blurb=A+limited-run+print+of+the+full+course...
*/
function applyUrlOverrides(){
  const p = new URLSearchParams(window.location.search);
  if (p.get("hero")) CONFIG.heroImage = p.get("hero");
  if (p.get("title")) CONFIG.productName = p.get("title");
  if (p.get("blurb")) CONFIG.productBlurb = p.get("blurb");
}
applyUrlOverrides();

function isAdmin(){
  return new URLSearchParams(window.location.search).get("admin") === "1";
}

function fmtMoney(n){ return "$" + n.toFixed(2); }
function escCsv(v){
  const s = (v === undefined || v === null) ? "" : String(v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

          ${CONFIG.heroImage
            ? `<img src="${CONFIG.heroImage}" alt="${CONFIG.productName}">`
            : `<div class="placeholder">Add a hero image — set CONFIG.heroImage in the code</div>`}
        </div>

        <div class="details">
          <h2>Bring Cohasset Golf Club Home Today</h2>
          <p>Fill out the form below to reserve your print. Your order will be billed directly to your Cohasset Golf Club account — no payment needed here.</p>
          <div class="prices">
            ${CONFIG.formats.map(f => `<span>${f.label} — <b>${fmtMoney(f.price)}</b></span>`).join("")}
          </div>
          <p class="hero-caption" style="text-align:left; padding:6px 0 0;">18"x24" archival quality prints</p>
        </div>

        <div class="step">
          <div class="step-label"><span class="name">Your info</span></div>
          <label class="field"><span>Full name</span>
            <input type="text" id="buyerName" placeholder="Jordan Lee">
          </label>
          <label class="field" style="margin-bottom:0"><span>Email</span>
            <input type="email" id="buyerEmail" placeholder="jordan@email.com">
          </label>
        </div>

        <div class="step">
          <div class="step-label"><span class="name">1. Format</span></div>
          <div class="pillgroup" id="formatGroup">
            ${CONFIG.formats.map(f => `
              <button type="button" class="pill" data-format="${f.id}">
                <span class="t">${f.label}</span>
                <span class="p">${fmtMoney(f.price)}</span>
                ${f.id === "framed" ? `<span class="frame-note">Semi-hardwood frames, acrylic glazing, gallery-style backings and pre-installed hanging hardware. Produced with American-sourced mouldings in New Haven, CT.</span>` : ""}
              </button>`).join("")}
          </div>
        </div>

        <div class="step hidden" id="colorStep">
          <div class="step-label"><span class="name">Frame color</span></div>
          <div class="pillgroup" id="colorGroup">
            ${["Black","White","Walnut"].map(c => `
              <button type="button" class="pill" data-color="${c}" style="text-align:center;">
                <span class="t">${c}</span>
              </button>`).join("")}
          </div>
        </div>

        <div class="step hidden" id="qtyStep">
          <div class="step-label"><span class="name">2. Quantity</span></div>
          <div class="qtyrow">
            <div class="stepper">
              <button type="button" id="qtyMinus">–</button>
              <input type="text" id="qtyInput" value="1" readonly>
              <button type="button" id="qtyPlus">+</button>
            </div>
            <span class="note" id="qtySubtotal"></span>
          </div>
        </div>

        <div class="step hidden" id="shipStep">
          <div class="step-label"><span class="name">3. Shipping</span></div>
          <div class="pillgroup" id="shipGroup">
            <button type="button" class="pill" data-ship="club">
              <span class="t">Ship to club</span>
              <span class="p">Free — picked up through the organizer</span>
            </button>
            <button type="button" class="pill" data-ship="me">
              <span class="t">Ship to me</span>
              <span class="p" id="shipMeCost">+ calculated at checkout</span>
            </button>
          </div>

          <div class="addr hidden" id="addrBlock">
            <label class="field"><span>Recipient name</span>
              <input type="text" id="addrName" placeholder="Jordan Lee">
            </label>
            <label class="field"><span>Address line 1</span>
              <input type="text" id="addrLine1" placeholder="123 Trailhead Rd">
            </label>
            <label class="field"><span>Address line 2 (optional)</span>
              <input type="text" id="addrLine2" placeholder="Apt, suite, etc.">
            </label>
            <div class="row3">
              <label class="field"><span>City</span><input type="text" id="addrCity"></label>
              <label class="field"><span>State</span>
                <select id="addrState">
                  <option value="">–</option>
                  ${STATES.map(s => `<option value="${s}">${s}</option>`).join("")}
                </select>
              </label>
              <label class="field"><span>ZIP</span><input type="text" id="addrZip" maxlength="10"></label>
            </div>
            <label class="field" style="margin-bottom:0"><span>Phone (optional)</span>
              <input type="tel" id="addrPhone" placeholder="For shipping carrier updates">
            </label>
          </div>
        </div>

        <div class="summary hidden" id="summaryBlock">
          <div class="line"><span id="sumFormatLabel"></span><span id="sumFormatPrice"></span></div>
          <div class="line"><span>Shipping</span><span id="sumShip"></span></div>
          <div class="line total"><span>Total</span><span id="sumTotal"></span></div>
        </div>

        <div class="submitwrap">
          <button type="button" class="submit" id="submitBtn" disabled>Submit order</button>
          <p style="text-align:center; font-size:11px; font-style:italic; color:var(--ink-soft); margin:10px 0 0;">The club will bill your account directly for your purchase. Thanks for the order!</p>
          <div class="errtext" id="errText"></div>
        </div>
      </div>

      <footer class="foot">Ordering for ${club} · questions go directly to the organizer</footer>
    </div>
  `;

  const $ = id => document.getElementById(id);

  function calc(){
    const fmt = CONFIG.formats.find(f => f.id === state.format);
    const subtotal = fmt ? fmt.price * state.qty : 0;
    const shipCost = (fmt && state.shipping === "me") ? CONFIG.shippingCost(state.format, state.qty)
                    : (state.shipping === "club") ? 0 : null;
    const total = shipCost !== null ? subtotal + shipCost : null;
    return { fmt, subtotal, shipCost, total };
  }

  function updateShipMeCost(){
    if (state.format){
      $("shipMeCost").textContent = "+ " + fmtMoney(CONFIG.shippingCost(state.format, state.qty));
    }
  }

  function updateSummary(){
    const { fmt, subtotal, shipCost, total } = calc();
    if (!fmt || !state.shipping){ $("summaryBlock").classList.add("hidden"); return; }
    $("summaryBlock").classList.remove("hidden");
    $("sumFormatLabel").textContent = `${fmt.label}${state.frameColor ? " (" + state.frameColor + ")" : ""} × ${state.qty}`;
    $("sumFormatPrice").textContent = fmtMoney(subtotal);
    $("sumShip").textContent = shipCost === 0 ? "Free" : fmtMoney(shipCost);
    $("sumTotal").textContent = fmtMoney(total);
    validate();
  }

  function validate(){
    const nameOk = state.buyerName.trim().length > 1;
    const emailOk = /\S+@\S+\.\S+/.test(state.buyerEmail);
    const formatOk = !!state.format;
    const colorOk = state.format !== "framed" || !!state.frameColor;
    const shipOk = !!state.shipping;
    let addrOk = true;
    if (state.shipping === "me"){
      const a = state.addr;
      addrOk = a.name && a.line1 && a.city && a.state && /^\d{5}(-\d{4})?$/.test(a.zip);
    }
    const ok = nameOk && emailOk && formatOk && colorOk && shipOk && addrOk;
    $("submitBtn").disabled = !ok;
    return ok;
  }

  $("buyerName").addEventListener("input", e => { state.buyerName = e.target.value; validate(); });
  $("buyerEmail").addEventListener("input", e => { state.buyerEmail = e.target.value; validate(); });

  $("formatGroup").addEventListener("click", e => {
    const btn = e.target.closest(".pill");
    if (!btn) return;
    state.format = btn.dataset.format;
    [...$("formatGroup").children].forEach(c => c.classList.toggle("selected", c === btn));
    $("qtySubtotal").textContent = fmtMoney(CONFIG.formats.find(f=>f.id===state.format).price) + " each";

    if (state.format === "framed"){
      state.frameColor = null;
      [...$("colorGroup").children].forEach(c => c.classList.remove("selected"));
      $("colorStep").classList.remove("hidden");
      $("colorStep").classList.add("fadein");
      $("qtyStep").classList.add("hidden");
      $("shipStep").classList.add("hidden");
    } else {
      state.frameColor = null;
      $("colorStep").classList.add("hidden");
      $("qtyStep").classList.remove("hidden");
      $("qtyStep").classList.add("fadein");
      $("shipStep").classList.remove("hidden");
      $("shipStep").classList.add("fadein");
    }
    updateShipMeCost();
    updateSummary();
  });

  $("colorGroup").addEventListener("click", e => {
    const btn = e.target.closest(".pill");
    if (!btn) return;
    state.frameColor = btn.dataset.color;
    [...$("colorGroup").children].forEach(c => c.classList.toggle("selected", c === btn));
    $("qtyStep").classList.remove("hidden");
    $("qtyStep").classList.add("fadein");
    $("shipStep").classList.remove("hidden");
    $("shipStep").classList.add("fadein");
    updateSummary();
  });

  $("qtyMinus").addEventListener("click", () => {
    state.qty = Math.max(1, state.qty - 1);
    $("qtyInput").value = state.qty;
    updateShipMeCost();
    updateSummary();
  });
  $("qtyPlus").addEventListener("click", () => {
    state.qty = Math.min(CONFIG.qtyMax, state.qty + 1);
    $("qtyInput").value = state.qty;
    updateShipMeCost();
    updateSummary();
  });

  $("shipGroup").addEventListener("click", e => {
    const btn = e.target.closest(".pill");
    if (!btn) return;
    state.shipping = btn.dataset.ship;
    [...$("shipGroup").children].forEach(c => c.classList.toggle("selected", c === btn));
    $("addrBlock").classList.toggle("hidden", state.shipping !== "me");
    if (state.shipping === "me") $("addrBlock").classList.add("fadein");
    updateSummary();
  });

  ["addrName","addrLine1","addrLine2","addrCity","addrZip","addrPhone"].forEach(id => {
    $(id).addEventListener("input", e => {
      const key = id.replace("addr","");
      const map = { Name:"name", Line1:"line1", Line2:"line2", City:"city", Zip:"zip", Phone:"phone" };
      state.addr[map[key]] = e.target.value;
      validate();
    });
  });
  $("addrState").addEventListener("change", e => { state.addr.state = e.target.value; validate(); });

  $("submitBtn").addEventListener("click", async () => {
    if (!validate()) return;
    $("submitBtn").disabled = true;
    $("submitBtn").textContent = "Submitting…";
    const { fmt, subtotal, shipCost, total } = calc();
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    const order = {
      id, club, timestamp: new Date().toISOString(),
      buyerName: state.buyerName.trim(), buyerEmail: state.buyerEmail.trim(),
      format: fmt.label, frameColor: state.frameColor || "", qty: state.qty, unitPrice: fmt.price, subtotal,
      shippingMethod: state.shipping === "me" ? "Ship to me" : "Ship to club",
      shippingCost: shipCost, total,
      shipName: state.shipping === "me" ? state.addr.name : "",
      addrLine1: state.shipping === "me" ? state.addr.line1 : "",
      addrLine2: state.shipping === "me" ? state.addr.line2 : "",
      city: state.shipping === "me" ? state.addr.city : "",
      state_: state.shipping === "me" ? state.addr.state : "",
      zip: state.shipping === "me" ? state.addr.zip : "",
      phone: state.shipping === "me" ? state.addr.phone : ""
    };
    try{
      if (!CONFIG.formspreeUrl) throw new Error("not configured");
      await submitToFormspree(order);
      renderConfirm(root, order);
    }catch(err){
      $("errText").textContent = "Something went wrong saving your order — please try again.";
      $("errText").classList.add("show");
      $("submitBtn").disabled = false;
      $("submitBtn").textContent = "Submit order";
    }
  });
}

/* Posts order data to Formspree via a normal fetch() — Formspree supports real
   CORS, so no iframe workaround is needed, and we get a real success/failure
   response back (unlike the old Apps Script approach). */
async function submitToFormspree(order){
  const res = await fetch(CONFIG.formspreeUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify(order)
  });
  if (!res.ok) throw new Error("Formspree submission failed: " + res.status);
  return true;
}

function renderConfirm(root, order){
  root.innerHTML = `
    <div class="wrap">
      <div class="ticket confirm">
        <div class="mark">✓</div>
        <h2>Order received</h2>
        <p>Thanks, ${order.buyerName.split(" ")[0]} — your ${order.format.toLowerCase()} map is reserved for ${order.club}.
        ${order.shippingMethod === "Ship to me" ? "We’ll ship directly to the address you provided." : "You’ll be able to pick it up through the club."}</p>
        <div class="oid">Order ${order.id}</div>
        <button type="button" class="submit" id="placeAnotherBtn" style="margin:22px auto 0; max-width:240px; display:block;">Place another order</button>
      </div>
    </div>
  `;
  document.getElementById("placeAnotherBtn").addEventListener("click", () => {
    renderOrderForm(root);
  });
}

/* ============================ ADMIN VIEW ============================ */
/* Order data lives in your Formspree dashboard — open it any time to view,
   sort, or export orders as CSV. This screen just points people here
   instead of showing a dead dashboard. */
function renderAdmin(root){
  root.innerHTML = `
    <div class="wrap admin-gate">
      <h2>Order data lives in Formspree</h2>
      <p style="color:#cdd0d4; font-size:14px; line-height:1.6;">
        Open your connected Formspree form to view, sort, or export orders as a CSV.
      </p>
    </div>
  `;
}

/* ============================ BOOT ============================ */
const root = document.getElementById("app");
if (isAdmin()){
  renderAdmin(root);
} else {
  renderOrderForm(root);
}
</script>
</body>
</html>
